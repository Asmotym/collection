services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_DEV_API_URL: http://backend:3000
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: deps
    command: npm run dev --prefix backend
    environment:
      PORT: 3000
      DATABASE_URL: postgres://collection:collection@postgres:5432/collection
      FRONTEND_URL: http://localhost:5173
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - backend-node-modules:/app/backend/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: collection
      POSTGRES_USER: collection
      POSTGRES_PASSWORD: collection
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collection -d collection"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  frontend-node-modules:
  backend-node-modules:
  postgres-data:
