services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_DISCORD_CLIENT_ID: ${VITE_DISCORD_CLIENT_ID:?VITE_DISCORD_CLIENT_ID must be set in .env}
        VITE_DISCORD_REDIRECT_URI: ${VITE_DISCORD_REDIRECT_URI:-}
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - proxy
      - collection-internal

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      MUSICBRAINZ_USER_AGENT: ${MUSICBRAINZ_USER_AGENT:-Collection/0.1.0 (https://github.com/Asmotym/collection)}
      CATALOG_DISCOGS_ENABLED: ${CATALOG_DISCOGS_ENABLED:-false}
      DISCOGS_TOKEN: ${DISCOGS_TOKEN:-}
      CATALOG_FANART_ENABLED: ${CATALOG_FANART_ENABLED:-false}
      FANART_API_KEY: ${FANART_API_KEY:-}
      CATALOG_LASTFM_ENABLED: ${CATALOG_LASTFM_ENABLED:-false}
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - proxy
      - collection-internal

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collection -d collection"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - proxy
      - collection-internal

volumes:
  postgres-data:

networks:
  proxy:
    external: true
  collection-internal:
    name: collection-internal
